<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | MichiePlus</title><style>:root{--ink:#172033;--muted:#667085;--brand:#3a3a78;--line:#e6e8ef;--bg:#f7f8fc;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.shell{max-width:1100px;margin:auto;padding:26px 20px 65px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{font-size:22px;color:var(--brand);font-weight:850;text-decoration:none}.back{color:var(--muted);text-decoration:none}.layout{display:grid;grid-template-columns:1fr 320px;gap:22px}.panel,.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.summary{height:max-content;position:sticky;top:20px}.item{display:grid;grid-template-columns:80px 1fr auto;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.thumb{height:75px;border-radius:10px;background:#eef0fa;display:grid;place-items:center;overflow:hidden;font-size:30px;color:#969abf}.thumb img{width:100%;height:100%;object-fit:cover}.item h2{font-size:17px;margin:0 0 4px}.muted{color:var(--muted)}.qty{display:flex;align-items:center;gap:9px;margin-top:9px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:18px}.qty button:disabled{opacity:.45;cursor:not-allowed}.remove{border:0;background:transparent;color:var(--danger);cursor:pointer;font-weight:700}.line-total{font-weight:850;color:var(--brand);white-space:nowrap}.row{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted)}.row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:19px;color:var(--ink);font-weight:850}.primary,.danger{width:100%;border:0;border-radius:9px;padding:12px;margin-top:17px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.danger{background:#fff3f2;color:var(--danger)}button:disabled{opacity:.6;cursor:wait}.state{text-align:center;padding:50px 15px;color:var(--muted)}.error{background:#fff3f2;color:var(--danger);border-radius:9px;padding:13px;margin-bottom:15px}.loading{color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{position:static}.item{grid-template-columns:60px 1fr}.line-total{grid-column:2}.thumb{height:60px}}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="{{ url_for('marketplace') }}">MichiePlus</a><a class="back" href="{{ url_for('marketplace') }}">← Continue shopping</a></header><div id="error" class="error" hidden></div><div class="layout"><section class="panel"><h1>Your cart</h1><div id="loading" class="loading">Loading your cart…</div><div id="items"></div><div id="empty" class="state" hidden><h2>Your cart is empty</h2><p>Browse the marketplace to find something useful.</p></div></section><aside class="summary"><h2>Order summary</h2><div class="row"><span>Items</span><strong id="count">0</strong></div><div class="row"><span>Subtotal</span><strong id="subtotal">₦0.00</strong></div><div class="row"><span>VAT</span><strong id="vat">₦0.00</strong></div><div class="row total"><span>Total</span><strong id="total">₦0.00</strong></div><button id="checkout" class="primary" disabled>Proceed to checkout</button><button id="clear" class="danger" disabled>Clear cart</button></aside></div></main>
<script src="{{ url_for('static', filename='js/cart.js') }}"></script>
<script>
const money = (value) => '₦' + Number(value || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const errorBox = document.getElementById('error');
function showError(message) { errorBox.textContent = message; errorBox.hidden = false; }
function clearError() { errorBox.hidden = true; }

function render(data) {
  const items = document.getElementById('items');
  items.replaceChildren();
  document.getElementById('loading').hidden = true;
  document.getElementById('empty').hidden = data.items.length !== 0;
  document.getElementById('count').textContent = data.count;
  document.getElementById('subtotal').textContent = money(data.subtotal);
  document.getElementById('vat').textContent = money(data.vat);
  document.getElementById('total').textContent = money(data.total);
  document.getElementById('checkout').disabled = data.items.length === 0;
  document.getElementById('clear').disabled = data.items.length === 0;
  for (const item of data.items) {
    const el = document.createElement('article');
    el.className = 'item';
    el.innerHTML = `<div class="thumb">${item.cover_image ? `<img src="${item.cover_image}" alt="">` : '▧'}</div><div><h2>${item.title}</h2><div class="muted">${item.vendor_name || 'MichiePlus Vendor'} · ${item.item_type}</div><div class="qty"><button class="minus" ${item.item_type === 'course' ? 'disabled' : ''}>−</button><strong>${item.quantity}</strong><button class="plus" ${item.item_type === 'course' ? 'disabled' : ''}>+</button><button class="remove">Remove</button></div></div><div class="line-total">${money(item.line_total)}</div>`;
    el.querySelector('.minus').onclick = () => change(item.cart_id, item.quantity - 1);
    el.querySelector('.plus').onclick = () => change(item.cart_id, item.quantity + 1);
    el.querySelector('.remove').onclick = () => removeItem(item.cart_id);
    items.appendChild(el);
  }
}

async function load() {
  clearError();
  document.getElementById('loading').hidden = false;
  try {
    const body = await MichiePlusCart.apiFetch('/api/cart');
    render(body.data);
  } catch (error) {
    console.error('Cart load failed:', error);
    showError(error.message);
  } finally {
    document.getElementById('loading').hidden = true;
  }
}

async function change(id, quantity) {
  clearError();
  if (quantity < 1) {
    if (confirm('Remove this item from your cart?')) removeItem(id);
    return;
  }
  try {
    await MichiePlusCart.apiFetch('/api/cart/update/' + id, { method: 'PUT', body: JSON.stringify({ quantity }) });
    await load();
  } catch (error) {
    console.error('Cart update failed:', error);
    showError(error.message);
  }
}

async function removeItem(id) {
  clearError();
  try {
    await MichiePlusCart.apiFetch('/api/cart/remove/' + id, { method: 'DELETE' });
    await load();
  } catch (error) {
    console.error('Cart remove failed:', error);
    showError(error.message);
  }
}

document.getElementById('clear').onclick = async () => {
  if (!confirm('Clear every item from your cart?')) return;
  const button = document.getElementById('clear');
  button.disabled = true;
  try {
    await MichiePlusCart.apiFetch('/api/cart/clear', { method: 'DELETE' });
    await load();
  } catch (error) {
    console.error('Cart clear failed:', error);
    showError(error.message);
  } finally {
    button.disabled = false;
  }
};

document.getElementById('checkout').onclick = () => {
  window.location.href = '{{ url_for("checkout_cart") }}';
};

load();
</script>
</body></html>
